version: 2
updates:

- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: "cron"
    cronjob: "15 4 * * *" # every day 04:15 UTC
  open-pull-requests-limit: 10
  assignees:
  - Muckenbatscher
  labels:
  - Dependencies
  groups:
    aspire:
      patterns:
        - "Aspire*"
    fastendpoints:
      patterns:
        - "FastEndpoints*"
    scalar:
      patterns:
        - "Scalar*"
      update-types:
        - major
        - minor 
        # - patch # updated very frequently
    opentelemetry:
      patterns:
        - "OpenTelemetry*"
    mstest:
      patterns:
        - "MSTest*"
    core:
      patterns:
        - "Microsoft*"
        - "System*"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
  assignees:
  - Muckenbatscher
  labels:
  - Dependencies
